<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Buat Icon PWA</title>
<style>
  body{font-family:system-ui,sans-serif;background:#F5F0E4;color:#12100E;
    padding:32px 20px;max-width:560px;margin:0 auto;line-height:1.6}
  h1{font-family:Arial Black,sans-serif;font-size:26px;margin:0 0 8px}
  .icons{display:flex;gap:16px;flex-wrap:wrap;align-items:center;margin:24px 0}
  canvas{border:3px solid #12100E;box-shadow:4px 4px 0 #12100E;border-radius:16px;background:#FFC93C}
  #c512{width:120px;height:120px}
  #cmask{width:120px;height:120px;border-radius:50%}
  button{background:#FFC93C;color:#12100E;border:3px solid #12100E;
    padding:12px 18px;border-radius:12px;cursor:pointer;font-weight:700;
    box-shadow:4px 4px 0 #12100E;margin:6px 6px 6px 0;font-size:14px;font-family:inherit}
  button:active{transform:translate(4px,4px);box-shadow:0 0 0 #12100E}
  .steps{background:#FFFDF7;border:3px solid #12100E;border-radius:16px;
    padding:18px 22px;box-shadow:6px 6px 0 #12100E;margin-top:20px}
  .steps ol{padding-left:20px}
  code{background:#F5F0E4;padding:2px 6px;border-radius:4px;font-weight:700}
</style>
</head>
<body>
<h1>🎨 Buat Icon PWA</h1>
<p>Klik tombol di bawah → simpan ketiga file ke folder <code>icons/</code>.</p>

<div class="icons">
  <canvas id="c192" width="192" height="192" style="width:96px;height:96px"></canvas>
  <canvas id="c512" width="512" height="512"></canvas>
  <canvas id="cmask" width="512" height="512"></canvas>
</div>

<button onclick="download('c192','icon-192.png')">⬇ icon-192.png</button>
<button onclick="download('c512','icon-512.png')">⬇ icon-512.png</button>
<button onclick="download('cmask','icon-maskable-512.png')">⬇ icon-maskable-512.png</button>

<div class="steps">
  <h3 style="margin-top:0">📋 Langkah</h3>
  <ol>
    <li>Buat folder baru bernama <code>icons</code> di dalam folder game.</li>
    <li>Klik ketiga tombol di atas, simpan file ke folder <code>icons/</code>.</li>
    <li>Selesai — icon siap dipakai.</li>
  </ol>
</div>

<script>
function drawIcon(canvas, maskable) {
  const ctx = canvas.getContext('2d');
  const s = canvas.width;

  // Background kuning
  ctx.fillStyle = '#FFC93C';
  ctx.fillRect(0, 0, s, s);

  // Border hitam (kecuali maskable, biar aman di safe zone)
  if (!maskable) {
    ctx.strokeStyle = '#12100E';
    ctx.lineWidth = s * 0.05;
    ctx.strokeRect(s * 0.025, s * 0.025, s * 0.95, s * 0.95);
  }

  const cx = s / 2;
  const sc = maskable ? 0.72 : 1;

  // Huruf "T"
  ctx.fillStyle = '#12100E';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.font = `900 ${s * 0.34 * sc}px 'Arial Black', sans-serif`;
  ctx.fillText('T', cx, s / 2 - s * 0.18 * sc);

  // Badge "OR"
  const bw = s * 0.30 * sc, bh = s * 0.15 * sc;
  const bx = cx - bw / 2, by = s / 2 - bh / 2;
  const r = bh / 2;
  ctx.beginPath();
  ctx.moveTo(bx + r, by);
  ctx.lineTo(bx + bw - r, by);
  ctx.arcTo(bx + bw, by, bx + bw, by + r, r);
  ctx.lineTo(bx + bw, by + bh - r);
  ctx.arcTo(bx + bw, by + bh, bx + bw - r, by + bh, r);
  ctx.lineTo(bx + r, by + bh);
  ctx.arcTo(bx, by + bh, bx, by + bh - r, r);
  ctx.lineTo(bx, by + r);
  ctx.arcTo(bx, by, bx + r, by, r);
  ctx.closePath();
  ctx.fill();

  // Teks "OR"
  ctx.fillStyle = '#FFC93C';
  ctx.font = `900 ${s * 0.10 * sc}px 'Arial Black', sans-serif`;
  ctx.fillText('OR', cx, s / 2 + s * 0.008 * sc);

  // Huruf "D"
  ctx.fillStyle = '#12100E';
  ctx.font = `900 ${s * 0.34 * sc}px 'Arial Black', sans-serif`;
  ctx.fillText('D', cx, s / 2 + s * 0.19 * sc);
}

function download(id, filename) {
  const canvas = document.getElementById(id);
  const link = document.createElement('a');
  link.download = filename;
  link.href = canvas.toDataURL('image/png');
  link.click();
}

drawIcon(document.getElementById('c192'), false);
drawIcon(document.getElementById('c512'), false);
drawIcon(document.getElementById('cmask'), true);
</script>
</body>
</html>
